name: shedrive

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: "5000"
  MONGODB_URI: mongodb://mongo:27017/shedrive
  CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}"
  FACE_SERVICE_URL: http://face-service:8000
  JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env - copy .env.example to .env}"
  JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
  OTP_PROVIDER: "${OTP_PROVIDER:-mock}"
  STORAGE_DIR: /app/storage

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - shedrive-net

  seed:
    image: shedrive-backend:local
    command: ["npm", "run", "seed"]
    restart: "no"
    environment: *backend-env
    volumes:
      - backend-storage:/app/storage
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shedrive-net

  backend:
    image: shedrive-backend:local
    build: ./backend
    restart: unless-stopped
    init: true
    ports:
      - "5000:5000"
    environment: *backend-env
    volumes:
      - backend-storage:/app/storage
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      face-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - shedrive-net

  face-service:
    build: ./face-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CONF_THRESHOLD: "0.85"
      MAX_UPLOAD_MB: "5"
      FACE_MODEL: Facenet512
      DEEPFACE_BACKEND_ENGINE: onnx
      DETECTOR_BACKEND: opencv
      PRELOAD_MODELS: "true"
      MAX_CONCURRENT_VERIFICATIONS: "1"
      MAX_IMAGE_PIXELS: "25000000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)",
        ]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 30s
    networks:
      - shedrive-net

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shedrive-net

volumes:
  mongo-data:
  backend-storage:

networks:
  shedrive-net:
    driver: bridge
