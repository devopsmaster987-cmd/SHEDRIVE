apiVersion: apps/v1
kind: Deployment
metadata:
  name: shedrive-backend
  namespace: shedrive
  labels:
    app.kubernetes.io/name: shedrive-backend
    app.kubernetes.io/part-of: shedrive
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: shedrive-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shedrive-backend
        app.kubernetes.io/part-of: shedrive
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: shedrive-backend
      containers:
        - name: backend
          image: 111122223333.dkr.ecr.ap-south-1.amazonaws.com/shedrive/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: shedrive-backend-config
            - secretRef:
                name: shedrive-backend-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: license-docs
              mountPath: /app/storage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: license-docs
          persistentVolumeClaim:
            claimName: shedrive-license-docs
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shedrive-backend
  namespace: shedrive
  labels:
    app.kubernetes.io/name: shedrive-backend
    app.kubernetes.io/part-of: shedrive
spec:
  # AWS creates a public load balancer. Put CloudFront in front of it for TLS
  # and route /api/* and /socket.io/* there from the S3 frontend distribution.
  type: LoadBalancer
  # Keeps polling clients on one pod when the load balancer is reached directly.
  # Socket.IO is websocket-first and Redis carries rooms across replicas.
  sessionAffinity: ClientIP
  selector:
    app.kubernetes.io/name: shedrive-backend
  ports:
    - name: http
      port: 80
      targetPort: http
