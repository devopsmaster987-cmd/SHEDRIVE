apiVersion: apps/v1
kind: Deployment
metadata:
  name: shedrive-face
  namespace: shedrive
  labels:
    app.kubernetes.io/name: shedrive-face
    app.kubernetes.io/part-of: shedrive
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: shedrive-face
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shedrive-face
        app.kubernetes.io/part-of: shedrive
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: shedrive-face
      containers:
        - name: face-service
          image: 111122223333.dkr.ecr.ap-south-1.amazonaws.com/shedrive/face-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: shedrive-face-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            # DeepFace/ONNX is memory-hungry. Use at least t3.medium nodes and
            # watch for OOMKilled events on smaller instance types.
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shedrive-face
  namespace: shedrive
  labels:
    app.kubernetes.io/name: shedrive-face
    app.kubernetes.io/part-of: shedrive
spec:
  # Internal only: the backend reaches this over the cluster network.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shedrive-face
  ports:
    - name: http
      port: 8000
      targetPort: http
