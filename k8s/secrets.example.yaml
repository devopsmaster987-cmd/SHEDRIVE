# Copy to k8s/secrets.yaml, fill in real values and apply it separately.
# k8s/secrets.yaml is git-ignored. Never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: shedrive-backend-secrets
  namespace: shedrive
  labels:
    app.kubernetes.io/name: shedrive-backend
    app.kubernetes.io/part-of: shedrive
type: Opaque
stringData:
  # MongoDB Atlas SRV connection string for the production database.
  MONGODB_URI: mongodb+srv://USERNAME:PASSWORD@cluster0.example.mongodb.net/shedrive?retryWrites=true&w=majority
  # Generate with: openssl rand -hex 32
  JWT_SECRET: replace-with-a-long-random-string
