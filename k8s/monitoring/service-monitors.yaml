apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shedrive-backend
  namespace: shedrive
  labels:
    release: monitoring
    app.kubernetes.io/name: shedrive-backend
    app.kubernetes.io/part-of: shedrive
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: shedrive-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shedrive-face
  namespace: shedrive
  labels:
    release: monitoring
    app.kubernetes.io/name: shedrive-face
    app.kubernetes.io/part-of: shedrive
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: shedrive-face
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
