# Internal Redis instance used only for Socket.IO pub/sub between backend
# replicas. There is no persistent data to keep.
apiVersion: v1
kind: Service
metadata:
  name: shedrive-redis
  namespace: shedrive
  labels:
    app.kubernetes.io/name: shedrive-redis
    app.kubernetes.io/part-of: shedrive
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shedrive-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shedrive-redis
  namespace: shedrive
  labels:
    app.kubernetes.io/name: shedrive-redis
    app.kubernetes.io/part-of: shedrive
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shedrive-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shedrive-redis
        app.kubernetes.io/part-of: shedrive
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
