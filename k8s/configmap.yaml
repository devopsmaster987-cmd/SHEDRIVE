apiVersion: v1
kind: ConfigMap
metadata:
  name: shedrive-backend-config
  namespace: shedrive
  labels:
    app.kubernetes.io/name: shedrive-backend
    app.kubernetes.io/part-of: shedrive
data:
  NODE_ENV: production
  PORT: "5000"
  # Replace with the CloudFront distribution domain used by the frontend.
  CORS_ORIGINS: https://shedrive.example.com
  FACE_SERVICE_URL: http://shedrive-face:8000
  REDIS_URL: redis://shedrive-redis:6379
  JWT_EXPIRES_IN: 7d
  BCRYPT_ROUNDS: "12"
  OTP_PROVIDER: mock
  OTP_EXPIRY_MINUTES: "10"
  OTP_MAX_ATTEMPTS: "5"
  STORAGE_DIR: /app/storage
  FACE_CONFIDENCE_THRESHOLD: "0.85"
  FACE_TIMEOUT_MS: "20000"
  FARE_BASE: "40"
  FARE_PER_KM: "14"
  FARE_ROAD_FACTOR: "1.25"
  FARE_MINIMUM: "50"
  RIDE_SEARCH_RADIUS_KM: "5"
  RIDE_OFFER_TTL_SECONDS: "45"
  RIDE_REQUEST_TTL_MINUTES: "10"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shedrive-face-config
  namespace: shedrive
  labels:
    app.kubernetes.io/name: shedrive-face
    app.kubernetes.io/part-of: shedrive
data:
  CONF_THRESHOLD: "0.85"
  MAX_UPLOAD_MB: "5"
  FACE_MODEL: Facenet512
  DEEPFACE_BACKEND_ENGINE: onnx
  DETECTOR_BACKEND: opencv
  PRELOAD_MODELS: "true"
  MAX_IMAGE_PIXELS: "25000000"
  MAX_CONCURRENT_VERIFICATIONS: "1"
  VERIFY_TIMEOUT_SECONDS: "20"
  LOG_LEVEL: info
